<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Site</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="star-container"></div>
    <div id="banner" class="banner"></div>

    <div class="container">
        <div id="intro-section"></div>

        <div class="section-title-area">
            <h2 id="char-title">CHARACTERS</h2>
        </div>
        <div id="character-grid" class="character-grid"></div>
    </div>

    <script src="data.js"></script>
    
    <script>
        // --- 1. 禁止右鍵功能 ---
        document.addEventListener('contextmenu', event => event.preventDefault());

        // --- 2. 初始化設定 (關鍵：將 data.js 的設定寫入 CSS 變數) ---
        const rootStyles = document.documentElement.style;
        const config = websiteData.config;

        // 基礎顏色
        rootStyles.setProperty('--bg-color', config.backgroundColor);
        rootStyles.setProperty('--theme-color', config.themeColor);

        // 【功能生效】後方框線透明度
        rootStyles.setProperty('--offset-opacity', config.offsetBorderOpacity);

        // 【功能生效】分區標題 (ABOUT ME, CHARACTERS)
        rootStyles.setProperty('--title-font', config.sectionTitleStyle.fontFamily);
        rootStyles.setProperty('--title-size', config.sectionTitleStyle.fontSize);

        // 【功能生效】關於我內文
        rootStyles.setProperty('--about-font', config.aboutStyle.fontFamily);
        rootStyles.setProperty('--about-size', config.aboutStyle.fontSize);

        // 【功能生效】角色內文
        rootStyles.setProperty('--char-font', config.characterStyle.fontFamily);
        rootStyles.setProperty('--char-size', config.characterStyle.fontSize);

        // 1. 關於我盒子標題
        rootStyles.setProperty('--about-box-title-font',         config.aboutBoxTitleStyle.fontFamily);
        rootStyles.setProperty('--about-box-title-size',         config.aboutBoxTitleStyle.fontSize);

        // 2. 角色名字標題
        rootStyles.setProperty('--char-name-font', config.charNameStyle.fontFamily);
        rootStyles.setProperty('--char-name-size', config.charNameStyle.fontSize);
        
        document.title = config.title;

        // --- 3. 渲染橫幅 ---
        const banner = document.getElementById('banner');
        banner.style.backgroundImage = `url('${config.bannerUrl}')`;

        // --- 4. 渲染關於我 ---
        const introSection = document.getElementById('intro-section');
        introSection.innerHTML = `
            <div class="section-title-area">
                <h2>ABOUT ME</h2>
            </div>
            <div class="intro-container-narrow">
                <div class="double-border-box intro-box">
                    <div class="intro-content-wrapper">
                        <img src="${websiteData.intro.image}" alt="About" class="intro-img">
                        <div class="intro-text">
                            <h2 class="section-title">${websiteData.intro.title}</h2>
                            <p>${websiteData.intro.content}</p>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // --- 5. 渲染角色 ---
        const charGrid = document.getElementById('character-grid');
        
        websiteData.characters.forEach((char, index) => {
            const card = document.createElement('div');
            const rowNumber = Math.floor(index / 3);
            const isReversed = rowNumber % 2 !== 0;

            card.className = `double-border-box character-card ${isReversed ? 'reversed' : ''}`;
            
            card.innerHTML = `
                <img src="${char.image}" alt="${char.name}" class="char-img">
                <div class="char-info">
                    <h3 class="char-name">${char.name}</h3>
                    <p class="char-desc">${char.desc}</p>
                </div>
            `;
            charGrid.appendChild(card);
        });

        // --- 6. 星星特效 ---
        const starContainer = document.getElementById('star-container');
        const starCount = 60; 
        for(let i=0; i<starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            const minDuration = 5;  // 最快的一顆星要花幾秒掉下來
            const randomAdd = 10;   // 隨機增加的秒數範圍  
            const duration = Math.random() * randomAdd + minDuration; 
            star.style.animationDuration = duration + 's';
            star.style.animationDelay = Math.random() * 5 + 's';
            starContainer.appendChild(star);
        }
    </script>
</body>
</html>
